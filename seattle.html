<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>line city · seattle</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f3eee4; overflow: hidden; }
      canvas { display: block; touch-action: none; cursor: grab; }
      .ui { position: fixed; left: 20px; bottom: 18px; font: 13px/1.45 ui-monospace, Menlo, monospace; color: #1d1b19; user-select: none; max-width: 340px; }
      .ui h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; letter-spacing: 0.04em; }
      .ui .fine { opacity: 0.6; font-size: 11px; }
      .ui .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #1d1b19; vertical-align: -1px; margin-right: 3px; }
      .ui .dot.o { background: #d9603b; } .ui .dot.c { background: #f3eee4; }
      .ui button, .ui a.btn { display: inline-block; margin-top: 8px; margin-right: 6px; font: inherit; background: transparent; border: 1px solid #1d1b19; padding: 4px 10px; cursor: pointer; color: inherit; text-decoration: none; }
      .ui button:hover, .ui a.btn:hover { background: #1d1b19; color: #f3eee4; }
      #tip { position: fixed; display: none; pointer-events: auto; max-width: 260px; background: #f3eee4; border: 1.5px solid #1d1b19; padding: 8px 10px; font: 12px/1.45 ui-monospace, Menlo, monospace; color: #1d1b19; box-shadow: 3px 3px 0 #1d1b19; }
      #tip .name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
      #tip .st.open { color: #b8461f; font-weight: 600; }
      #tip .st.closed { opacity: 0.7; }
      #tip .sub { opacity: 0.7; }
      #tip a { color: #1d1b19; display: inline-block; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div class="ui">
      <h1>line city · seattle</h1>
      <div>drag to turn · right-drag to move · scroll to zoom</div>
      <div>hover a cup to see if it's open</div>
      <div style="margin-top:6px"><span class="dot o"></span>open <span class="dot c" style="margin-left:8px"></span>closed · <span id="count"></span></div>
      <div class="fine">hours from google maps (oct 2026), open/closed worked out live in seattle time</div>
      <button id="redraw">redraw</button><a class="btn" href="./">line city</a>
    </div>
    <div id="tip"></div>
    <script type="module" src="/src/seattle/main.ts"></script>
  </body>
</html>
